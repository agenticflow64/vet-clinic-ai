<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Заявки на приём — админка</title>
<style>
  :root {
    --accent: #a6613a;
    --accent-dark: #874c2c;
    --bg: #ffffff;
    --bg-alt: #f6f8fa;
    --text: #1f2328;
    --muted: #57606a;
    --border: #d0d7de;
  }
  * { box-sizing: border-box; margin: 0; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: var(--bg-alt);
    color: var(--text);
    padding: 20px 24px;
  }
  h1 { font-size: 20px; margin-bottom: 2px; }
  .sub { color: var(--muted); font-size: 13px; margin-bottom: 16px; }
  .table-wrap { overflow-x: auto; background: var(--bg); border: 1px solid var(--border); border-radius: 8px; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; min-width: 760px; }
  th, td { padding: 7px 10px; text-align: left; border-bottom: 1px solid var(--border); vertical-align: top; }
  th { font-size: 11.5px; font-weight: 600; text-transform: uppercase; letter-spacing: .3px; color: var(--muted); }
  tr:last-child td { border-bottom: none; }
  tr:hover td { background: var(--bg-alt); }
  td.time { color: var(--muted); white-space: nowrap; }
  .status {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 12.5px;
    font-weight: 600;
    white-space: nowrap;
  }
  .status i { width: 7px; height: 7px; border-radius: 50%; flex: none; }
  .status.new       { color: #9a6700; } .status.new i       { background: #9a6700; }
  .status.confirmed { color: #0969da; } .status.confirmed i { background: #0969da; }
  .status.done      { color: #1a7f37; } .status.done i      { background: #1a7f37; }
  .status.cancelled { color: #cf222e; } .status.cancelled i { background: #cf222e; }
  select {
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 3px 6px;
    font-size: 12.5px;
    background: var(--bg);
    color: var(--text);
  }
  select:focus { outline: 1px solid var(--accent); }
  .empty { padding: 28px; text-align: center; color: var(--muted); }
  .actions { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
  button.reload {
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--text);
    padding: 6px 12px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 13px;
  }
  button.reload:hover { border-color: var(--accent); color: var(--accent-dark); }
  .count { font-size: 13px; color: var(--muted); }
</style>
</head>
<body>
<h1>Заявки на приём</h1>
<p class="sub">Заявки, созданные в чате виджета</p>

<div class="actions">
  <span class="count" id="count"></span>
  <button class="reload" onclick="load()">Обновить</button>
</div>

<div class="table-wrap">
  <table>
    <thead>
      <tr>
        <th>№</th><th>Создана</th><th>Животное</th><th>Кличка</th>
        <th>Услуга</th><th>Желаемое время</th><th>Телефон</th><th>Статус</th>
      </tr>
    </thead>
    <tbody id="rows"></tbody>
  </table>
  <div class="empty" id="empty" hidden>Пока нет заявок — создайте одну через виджет</div>
</div>

<script>
var STATUSES = ["new", "confirmed", "done", "cancelled"];
var LABELS = { new: "новая", confirmed: "подтверждена", done: "завершена", cancelled: "отменена" };

function fmtTs(ts) {
  var d = new Date(ts * 1000);
  return d.toLocaleDateString("ru-RU") + " " + d.toLocaleTimeString("ru-RU", { hour: "2-digit", minute: "2-digit" });
}

function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
    return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
  });
}

function load() {
  fetch("/api/appointments").then(function (r) { return r.json(); }).then(function (items) {
    var rows = document.getElementById("rows");
    document.getElementById("empty").hidden = items.length > 0;
    document.getElementById("count").textContent = "Всего: " + items.length;
    rows.innerHTML = items.map(function (a) {
      var options = STATUSES.map(function (s) {
        return '<option value="' + s + '"' + (s === a.status ? " selected" : "") + ">" + LABELS[s] + "</option>";
      }).join("");
      return "<tr>" +
        "<td>" + a.id + "</td>" +
        '<td class="time">' + fmtTs(a.created_at) + "</td>" +
        "<td>" + esc(a.pet_type) + "</td>" +
        "<td>" + esc(a.pet_name) + "</td>" +
        "<td>" + esc(a.service) + "</td>" +
        "<td>" + esc(a.preferred_time) + "</td>" +
        "<td>" + esc(a.phone) + "</td>" +
        '<td><span class="status ' + a.status + '"><i></i>' + LABELS[a.status] + '</span> ' +
        '<select onchange="setStatus(' + a.id + ', this.value)">' + options + "</select></td>" +
        "</tr>";
    }).join("");
  });
}

function setStatus(id, status) {
  fetch("/api/appointments/" + id, {
    method: "PATCH",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ status: status })
  }).then(load);
}

load();
</script>
</body>
</html>
