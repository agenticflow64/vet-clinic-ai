<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Чат клиники «Каштанка»</title>
<style>
  :root {
    --accent: #a6613a;          /* фирменный цвет kashtanka64.ru */
    --accent-dark: #874c2c;
    --bg: #f6f8fa;
    --panel: #ffffff;
    --text: #1f2328;
    --muted: #57606a;
    --border: #d0d7de;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    flex-direction: column;
  }

  header {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 12px 14px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    flex: none;
  }
  .logo {
    width: 34px; height: 34px;
    border-radius: 50%;
    background: var(--panel);
    border: 1px solid var(--border);
    color: var(--accent);
    display: grid;
    place-items: center;
    flex: none;
  }
  .logo svg { width: 18px; height: 18px; }
  .title { font-weight: 600; font-size: 14.5px; line-height: 1.25; }
  .subtitle { font-size: 12px; color: var(--muted); }
  .spacer { flex: 1; }
  .dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: #1a7f37;
    flex: none;
  }

  #messages {
    flex: 1;
    overflow-y: auto;
    padding: 14px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .msg {
    max-width: 85%;
    padding: 9px 12px;
    border-radius: 10px;
    font-size: 14px;
    line-height: 1.45;
    white-space: pre-wrap;
    word-wrap: break-word;
  }
  .msg.bot {
    align-self: flex-start;
    background: var(--panel);
    border: 1px solid var(--border);
    border-top-left-radius: 4px;
  }
  .msg.user {
    align-self: flex-end;
    background: var(--accent);
    color: #fff;
    border-top-right-radius: 4px;
  }
  .msg .badge {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    margin-top: 6px;
    font-size: 12px;
    font-weight: 600;
  }
  .badge i { width: 7px; height: 7px; border-radius: 50%; flex: none; }
  .badge.urgent  { color: #cf222e; } .badge.urgent i  { background: #cf222e; }
  .badge.soon    { color: #9a6700; } .badge.soon i    { background: #9a6700; }
  .badge.routine { color: #1a7f37; } .badge.routine i { background: #1a7f37; }

  .chips { display: flex; flex-wrap: wrap; gap: 6px; padding: 0 14px 10px; }
  .chip {
    border: 1px solid var(--border);
    background: var(--panel);
    color: var(--text);
    border-radius: 6px;
    padding: 5px 10px;
    font-size: 12.5px;
    cursor: pointer;
  }
  .chip:hover { border-color: var(--accent); color: var(--accent-dark); }

  .typing { display: flex; gap: 4px; padding: 4px 6px; }
  .typing span {
    width: 6px; height: 6px;
    background: var(--muted);
    border-radius: 50%;
    animation: blink 1.2s infinite;
  }
  .typing span:nth-child(2) { animation-delay: .2s; }
  .typing span:nth-child(3) { animation-delay: .4s; }
  @keyframes blink { 0%, 80%, 100% { opacity: .25; } 40% { opacity: 1; } }

  form {
    display: flex;
    gap: 8px;
    padding: 10px 12px;
    background: var(--panel);
    border-top: 1px solid var(--border);
    flex: none;
  }
  input {
    flex: 1;
    border: 1px solid var(--border);
    background: var(--panel);
    color: var(--text);
    border-radius: 6px;
    padding: 9px 12px;
    font-size: 14px;
    outline: none;
  }
  input:focus { border-color: var(--accent); }
  button.send {
    border: none;
    background: var(--accent);
    color: #fff;
    border-radius: 6px;
    width: 38px;
    cursor: pointer;
    display: grid;
    place-items: center;
  }
  button.send svg { width: 16px; height: 16px; }
  button.send:hover { background: var(--accent-dark); }
  button.send:disabled { opacity: .5; }
  .error { color: #cf222e; font-size: 12px; padding: 4px 14px 8px; }
</style>
</head>
<body>
<header>
  <div class="logo" aria-hidden="true">
    <svg viewBox="0 0 24 24" fill="currentColor">
      <ellipse cx="12" cy="15.5" rx="4.6" ry="3.8"/>
      <circle cx="5.6" cy="10.2" r="2.1"/>
      <circle cx="9.9" cy="7.4" r="2.1"/>
      <circle cx="14.1" cy="7.4" r="2.1"/>
      <circle cx="18.4" cy="10.2" r="2.1"/>
    </svg>
  </div>
  <div>
    <div class="title">Клиника «Каштанка»</div>
    <div class="subtitle">администратор на связи</div>
  </div>
  <div class="spacer"></div>
  <div class="dot" title="онлайн"></div>
</header>

<div id="messages"></div>
<div class="chips" id="chips">
  <button class="chip" data-q="Сколько стоит стерилизация кошки?">Сколько стоит стерилизация кошки?</button>
  <button class="chip" data-q="Кот вялый и не ест, что делать?">Питомцу плохо</button>
  <button class="chip" data-q="Хочу записаться на приём">Записаться на приём</button>
</div>

<form id="form">
  <input id="input" type="text" placeholder="Напишите сообщение…" autocomplete="off" maxlength="500">
  <button class="send" type="submit" id="send" aria-label="Отправить">
    <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
      <path d="M3 11.4 21 3l-8.4 18-2.5-7.1L3 11.4z"/>
    </svg>
  </button>
</form>

<script>
(function () {
  var params = new URLSearchParams(location.search);
  var accent = params.get("accent");
  if (accent) document.documentElement.style.setProperty("--accent", "#" + accent.replace(/^#/, ""));

  var messagesEl = document.getElementById("messages");
  var form = document.getElementById("form");
  var input = document.getElementById("input");
  var send = document.getElementById("send");

  var SESSION_KEY = "vet_widget_session";
  var sessionId = null;
  try { sessionId = localStorage.getItem(SESSION_KEY); } catch (e) {}
  if (!sessionId) {
    sessionId = "w" + Math.random().toString(36).slice(2, 10) + Date.now().toString(36);
    try { localStorage.setItem(SESSION_KEY, sessionId); } catch (e) {}
  }

  var URGENCY_BADGES = {
    surgery_now: ["urgent", "Срочно к врачу"],
    soon: ["soon", "Приём в ближайшие дни"],
    routine: ["routine", "Планово"]
  };

  function addBubble(role, text, urgency) {
    var el = document.createElement("div");
    el.className = "msg " + role;
    el.textContent = text;
    if (role === "bot" && urgency && URGENCY_BADGES[urgency]) {
      var b = document.createElement("span");
      b.className = "badge " + URGENCY_BADGES[urgency][0];
      var dot = document.createElement("i");
      b.appendChild(dot);
      b.appendChild(document.createTextNode(URGENCY_BADGES[urgency][1]));
      el.appendChild(document.createElement("br"));
      el.appendChild(b);
    }
    messagesEl.appendChild(el);
    messagesEl.scrollTop = messagesEl.scrollHeight;
    return el;
  }

  function showTyping() {
    var el = document.createElement("div");
    el.className = "msg bot";
    el.innerHTML = '<div class="typing"><span></span><span></span><span></span></div>';
    messagesEl.appendChild(el);
    messagesEl.scrollTop = messagesEl.scrollHeight;
    return el;
  }

  function greet() {
    addBubble("bot", "Здравствуйте! Это чат клиники «Каштанка». " +
      "Подскажу цены по прайсу, помогу понять, срочно ли нужен врач, и запишу на приём. Чем помочь?");
  }

  form.addEventListener("submit", function (e) {
    e.preventDefault();
    var text = input.value.trim();
    if (!text || send.disabled) return;
    input.value = "";
    addBubble("user", text);
    var typing = showTyping();
    send.disabled = true;

    fetch("/api/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ session_id: sessionId, message: text })
    })
      .then(function (r) { return r.json(); })
      .then(function (data) {
        typing.remove();
        addBubble("bot", data.reply || "…", data.urgency);
        if (data.appointment_id) {
          addBubble("bot", "Заявка №" + data.appointment_id + " отправлена в клинику. " +
            "Перезвоним и подтвердим время.");
        }
      })
      .catch(function () {
        typing.remove();
        addBubble("bot", "Сейчас не получается ответить. Позвоните нам: +7 (8452) 25-83-19");
      })
      .finally(function () { send.disabled = false; input.focus(); });
  });

  document.querySelectorAll(".chip").forEach(function (chip) {
    chip.addEventListener("click", function () {
      input.value = chip.dataset.q;
      form.dispatchEvent(new Event("submit", { cancelable: true }));
    });
  });

  greet();
})();
</script>
</body>
</html>
