<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ассистент клиники «Каштанка»</title>
<style>
  :root {
    --accent: #c2563a;
    --bg: #f7f4f0;
    --panel: #ffffff;
    --text: #2b2622;
    --muted: #8a8078;
    --border: #e8e1d9;
    --bot-bubble: #ffffff;
    --user-bubble: var(--accent);
    --user-text: #ffffff;
  }
  html[data-theme="dark"] {
    --bg: #1d1a17;
    --panel: #27231f;
    --text: #ece6df;
    --muted: #a1968c;
    --border: #3a342e;
    --bot-bubble: #312c26;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    flex-direction: column;
  }

  header {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 14px 16px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    flex: none;
  }
  .logo {
    width: 36px; height: 36px;
    border-radius: 10px;
    background: var(--accent);
    color: #fff;
    display: grid;
    place-items: center;
    font-size: 18px;
  }
  .title { font-weight: 600; font-size: 15px; line-height: 1.2; }
  .subtitle { font-size: 12px; color: var(--muted); }
  .spacer { flex: 1; }
  .dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: #3faa6e;
  }

  #messages {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .msg {
    max-width: 85%;
    padding: 10px 14px;
    border-radius: 16px;
    font-size: 14px;
    line-height: 1.45;
    white-space: pre-wrap;
    word-wrap: break-word;
  }
  .msg.bot {
    align-self: flex-start;
    background: var(--bot-bubble);
    border: 1px solid var(--border);
    border-bottom-left-radius: 4px;
  }
  .msg.user {
    align-self: flex-end;
    background: var(--user-bubble);
    color: var(--user-text);
    border-bottom-right-radius: 4px;
  }
  .msg .badge {
    display: inline-block;
    margin-top: 6px;
    padding: 2px 8px;
    border-radius: 8px;
    font-size: 11px;
    font-weight: 600;
  }
  .badge.urgent   { background: #fde8e4; color: #b3271e; }
  .badge.soon     { background: #fdf3d7; color: #8a6d1a; }
  .badge.routine  { background: #e2f3e8; color: #2c7a4b; }
  html[data-theme="dark"] .badge.urgent  { background: #4a2622; color: #f2a49b; }
  html[data-theme="dark"] .badge.soon    { background: #463c1d; color: #e5c97a; }
  html[data-theme="dark"] .badge.routine { background: #1f3a2b; color: #93d3ac; }

  .chips { display: flex; flex-wrap: wrap; gap: 6px; padding: 0 16px 10px; }
  .chip {
    border: 1px solid var(--border);
    background: var(--panel);
    color: var(--text);
    border-radius: 14px;
    padding: 6px 12px;
    font-size: 12.5px;
    cursor: pointer;
  }
  .chip:hover { border-color: var(--accent); }

  .typing { display: flex; gap: 4px; padding: 4px 8px; }
  .typing span {
    width: 6px; height: 6px;
    background: var(--muted);
    border-radius: 50%;
    animation: blink 1.2s infinite;
  }
  .typing span:nth-child(2) { animation-delay: .2s; }
  .typing span:nth-child(3) { animation-delay: .4s; }
  @keyframes blink { 0%, 80%, 100% { opacity: .25; } 40% { opacity: 1; } }

  form {
    display: flex;
    gap: 8px;
    padding: 12px;
    background: var(--panel);
    border-top: 1px solid var(--border);
    flex: none;
  }
  input {
    flex: 1;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--text);
    border-radius: 12px;
    padding: 10px 14px;
    font-size: 14px;
    outline: none;
  }
  input:focus { border-color: var(--accent); }
  button.send {
    border: none;
    background: var(--accent);
    color: #fff;
    border-radius: 12px;
    width: 42px;
    cursor: pointer;
    font-size: 16px;
  }
  button.send:disabled { opacity: .5; }
  .error { color: #b3271e; font-size: 12px; padding: 4px 16px 8px; }
</style>
</head>
<body>
<header>
  <div class="logo">🐾</div>
  <div>
    <div class="title">Ассистент клиники</div>
    <div class="subtitle">услуги, цены, запись на приём</div>
  </div>
  <div class="spacer"></div>
  <div class="dot" title="онлайн"></div>
</header>

<div id="messages"></div>
<div class="chips" id="chips">
  <button class="chip" data-q="Сколько стоит стерилизация кошки?">Сколько стоит стерилизация кошки?</button>
  <button class="chip" data-q="Кот вялый и не ест, что делать?">Питомцу плохо</button>
  <button class="chip" data-q="Хочу записаться на приём">Записаться на приём</button>
</div>

<form id="form">
  <input id="input" type="text" placeholder="Напишите вопрос…" autocomplete="off" maxlength="500">
  <button class="send" type="submit" id="send" aria-label="Отправить">➤</button>
</form>

<script>
(function () {
  var params = new URLSearchParams(location.search);
  var theme = params.get("theme") === "dark" ? "dark" : "light";
  var accent = params.get("accent");
  document.documentElement.dataset.theme = theme;
  if (accent) document.documentElement.style.setProperty("--accent", "#" + accent.replace(/^#/, ""));

  var messagesEl = document.getElementById("messages");
  var form = document.getElementById("form");
  var input = document.getElementById("input");
  var send = document.getElementById("send");

  var SESSION_KEY = "vet_widget_session";
  var sessionId = null;
  try { sessionId = localStorage.getItem(SESSION_KEY); } catch (e) {}
  if (!sessionId) {
    sessionId = "w" + Math.random().toString(36).slice(2, 10) + Date.now().toString(36);
    try { localStorage.setItem(SESSION_KEY, sessionId); } catch (e) {}
  }

  var URGENCY_BADGES = {
    surgery_now: ["urgent", "Срочно к врачу"],
    soon: ["soon", "Приём в ближайшие дни"],
    routine: ["routine", "Планово"]
  };

  function addBubble(role, text, urgency) {
    var el = document.createElement("div");
    el.className = "msg " + role;
    el.textContent = text;
    if (role === "bot" && urgency && URGENCY_BADGES[urgency]) {
      var b = document.createElement("span");
      b.className = "badge " + URGENCY_BADGES[urgency][0];
      b.textContent = URGENCY_BADGES[urgency][1];
      el.appendChild(document.createElement("br"));
      el.appendChild(b);
    }
    messagesEl.appendChild(el);
    messagesEl.scrollTop = messagesEl.scrollHeight;
    return el;
  }

  function showTyping() {
    var el = document.createElement("div");
    el.className = "msg bot";
    el.innerHTML = '<div class="typing"><span></span><span></span><span></span></div>';
    messagesEl.appendChild(el);
    messagesEl.scrollTop = messagesEl.scrollHeight;
    return el;
  }

  function greet() {
    addBubble("bot", "Здравствуйте! Я ассистент ветеринарной клиники «Каштанка». " +
      "Помогу узнать цены на услуги, оценить срочность ситуации и записать вас на приём. Чем помочь?");
  }

  form.addEventListener("submit", function (e) {
    e.preventDefault();
    var text = input.value.trim();
    if (!text || send.disabled) return;
    input.value = "";
    addBubble("user", text);
    var typing = showTyping();
    send.disabled = true;

    fetch("/api/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ session_id: sessionId, message: text })
    })
      .then(function (r) { return r.json(); })
      .then(function (data) {
        typing.remove();
        addBubble("bot", data.reply || "…", data.urgency);
        if (data.appointment_id) {
          var el = document.createElement("div");
          el.className = "msg bot";
          el.innerHTML = "✅ Заявка №" + data.appointment_id + " отправлена в клинику";
          messagesEl.appendChild(el);
          messagesEl.scrollTop = messagesEl.scrollHeight;
        }
      })
      .catch(function () {
        typing.remove();
        addBubble("bot", "Извините, сервис временно недоступен. Позвоните нам: +7 (8452) 25-83-19");
      })
      .finally(function () { send.disabled = false; input.focus(); });
  });

  document.querySelectorAll(".chip").forEach(function (chip) {
    chip.addEventListener("click", function () {
      input.value = chip.dataset.q;
      form.dispatchEvent(new Event("submit", { cancelable: true }));
    });
  });

  greet();
})();
</script>
</body>
</html>
